name: edulink_admin
description: EduLink Admin Panel — Flutter Web

publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0

  # HTTP
  http: ^1.2.0

  # Fonts — same as student app
  google_fonts: ^6.1.0

  # Shared preferences for token storage
  shared_preferences: ^2.2.2

  # URL launcher
  url_launcher: ^6.2.5

  # Map
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
