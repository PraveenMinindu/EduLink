services:
  - type: web
    name: edulink-backend
    env: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: starter
    envVars:
      - key: FIREBASE_KEY_JSON
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"
